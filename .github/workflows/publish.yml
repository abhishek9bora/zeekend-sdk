# Publishes to npm with provenance: the package page shows which commit in
# this repository it was built from, attested by GitHub, so anyone installing
# it can check that what npm serves is what this repo contains.
#
# No token. npm trusts this workflow directly (OIDC "trusted publishing"),
# configured once on npmjs.com under the package's Settings > Trusted
# publishing: GitHub Actions, owner abhishek9bora, repository zeekend-sdk,
# workflow publish.yml. Provenance is generated automatically on that path.
#
# This workflow STAGES the version; it does not go live on its own. A
# maintainer approves it with 2FA, on npmjs.com under the package's Staged
# Packages tab or with `npm stage approve <stage-id>`. That is deliberate:
# this code runs inside publishers' apps, and nobody who merely gains push
# access to this repository should be able to change what every publisher
# serves without a person saying yes.
#
# Triggered by publishing a GitHub release whose tag is v<version>, where
# <version> matches package.json.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15 or later and Node 22.14 or later;
      # the npm bundled with Node is older.
      - run: npm install -g npm@latest
      - run: npm test
      - name: Tag must match package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: npm stage publish
